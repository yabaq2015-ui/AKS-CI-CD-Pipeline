name: K8s Monitoring and App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cicd-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------
      # 1. SETUP TOOLS
      # ---------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3

      # ---------------------------------
      # 2. PROVISION AKS INFRASTRUCTURE
      # ---------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-azurerm-cli-profile: true

      - name: Terraform Init & Apply
        working-directory: ./k8s-installation-terraform-ih
        env:
          ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform init
          terraform plan
          terraform apply --auto-approve

      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          cd k8s-installation-terraform-ih
          terraform output -raw kube_config > ~/.kube/config
          kubectl get nodes

      # ---------------------------------
      # 3. DEPLOY PROMETHEUS & GRAFANA
      # ---------------------------------
      - name: Deploy Monitoring Stack
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          # Install/Upgrade Prometheus & Grafana
          helm upgrade --install prometheus prometheus-community/prometheus --namespace monitoring
          helm upgrade --install grafana grafana/grafana --namespace monitoring

          # Expose via LoadBalancer
          kubectl get svc prometheus-server-ext -n monitoring || \
          kubectl expose service prometheus-server --namespace monitoring --type=LoadBalancer --target-port=9090 --name=prometheus-server-ext || true

          kubectl get svc grafana-ext -n monitoring || \
          kubectl expose service grafana --namespace monitoring --type=LoadBalancer --target-port=3000 --name=grafana-ext || true
